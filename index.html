<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu primeiro site</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef3fa; color: #172a46; font-family: Arial, sans-serif; }
    main { width: 100%; max-width: 640px; padding: 48px 32px; background: white; border-radius: 20px; box-shadow: 0 12px 40px #172a4614; text-align: center; }
    .tag { display: inline-block; padding: 8px 14px; border-radius: 24px; background: #dcfce7; color: #166534; font-size: 14px; }
    h1 { font-size: clamp(28px, 6vw, 42px); margin: 24px 0 16px; }
    p { line-height: 1.7; color: #526176; }
    footer { margin-top: 32px; font-size: 13px; color: #718096; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Olá, mundo!</span>
    <h1>Meu primeiro site está no ar!</h1>
    <p>Esta é uma página de teste publicada com o GitHub Pages.</p>
    <p>Em breve, este espaço receberá novos conteúdos.</p>
    <footer>Feito com HTML e CSS.</footer>
  </main>
</body>
</html>
